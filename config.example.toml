# labhud configuration example. Copy to config.toml and edit; check it with:
#
#     python3 config.py config.toml
#
# The screen is pages -> groups -> cards. Order in this file is order on screen. Pages rotate
# and can be opened directly as http://host:8095/#<page id>.
#
# Addresses below are from 192.0.2.0/24, a range reserved for documentation: replace them.

title = "LabHUD"        # browser tab title (optional, this is the default)
# include = ["pages/*.toml"]   # optional: more pages (and strip entries, actions, quiet hours) from
                               # other files, in name order after this file's; an edit to any of
                               # them reloads like an edit here

[[page]]
id = "general"          # lowercase letters only
title = "GENERAL"
# icon = "server"       # optional: beside the page's name in the menu (see a card's icon)
# columns = 3           # optional, 1 to 6: at most this many columns of cards on the page
# density = "compact"   # optional, compact or normal: this page's spacing (else the screen's)

  [[page.group]]
  id = "pve"            # unique across all pages
  title = "Proxmox"
  # guests = "pve"        # optional: labhud adds a card for every guest of node "pve" that has
                          # none elsewhere, and removes it when the guest is deleted
  # guests_tag = "labhud" # optional, with guests: only the guests with this Proxmox tag
  # hidden = true         # optional: not shown on any screen (the apps' state leaves it out);
                          # the alerts of its cards stay active

    [[page.group.card]]
    id = "host-pve"                 # unique across all pages
    name = "PVE"
    subtitle = "i5-12500 · 64 GB"   # optional small line under the name
    ping = "192.0.2.10"             # status check, at most one of:
                                    #   ping    = "host"
                                    #   tcp     = "host:port"   (for hosts that drop ping)
                                    #   proxmox = "node/vmid"   (state from the Proxmox API)
    # hidden = true                 # optional: not shown on any screen; its alerts stay active
    size = "l"                      # optional, its place in the grid: s 1x1, m 2x1, l 2x2,
                                    # xl 4x2 cells. Without it the wall sizes the card by what
                                    # it shows (a list or many numbers: m or l); the older
                                    # large = true asks for a big one, as big as its numbers need
    icon = "proxmox"                # optional: a service icon from static/icons/svc
                                    # (design/icons.txt lists them) or a line icon (server, nas,
                                    # vm, pc, app). Without it the card takes its source's, or
                                    # its kind's. A container's card: the labhud.icon label
    url = "https://192.0.2.10:8006" # optional: the service's page, OPEN in the list view (?view=list)
    metrics = [
      # key: dotted path into the collected data; format: count, percent, percent1 (one
      # decimal), bytes, used_of ([used, total] bytes), rate (bytes/s), celsius
      { key = "proxmox.pve.vms", label = "VM", format = "count" },
      { key = "proxmox.pve.lxc", label = "LXC", format = "count" },
      # warn/crit (optional, any number): where this metric turns orange and red, high is bad
      { key = "proxmox.pve.cpu", label = "CPU", format = "percent" },
      { key = "proxmox.pve.mem_used_of", label = "RAM", format = "used_of" },
    ]
    panel = "host:pve"              # detail panel opened on tap (optional); host:<node> uses
                                    # the Proxmox node name exactly, case included;
                                    # list:<path> shows any list (docs/live-agent.md)
    # sensors = "temp.pve"          # optional: an object with gpu<N>_util/_mem/_temp, shown as
                                    # a GPU section in the host panel (agents/labhud-agent.py serves one)

    # Small cards: one per guest, state from Proxmox.
    [[page.group.card]]
    id = "vm-pve-100"
    name = "docker"
    proxmox = "pve/100"
    actions = ["vm-pve-100-start", "vm-pve-100-shutdown", "vm-pve-100-reboot"]

    [[page.group.card]]
    id = "vm-pve-101"
    name = "homeassistant"
    proxmox = "pve/101"

  [[page.group]]
  id = "storage"
  title = "Storage"

    [[page.group.card]]
    id = "nas"
    name = "NAS"
    ping = "192.0.2.20"
    large = true
    metrics = [
      { key = "synology.used_percent", label = "Used", format = "percent" },
      { key = "synology.free", label = "Free", format = "bytes" },
    ]

    [[page.group.card]]
    id = "backup"
    name = "BACKUP"
    ping = "192.0.2.21"
    on_demand = true      # normally off: shown grey when down, not red
    actions = ["wol-backup"]

  [[page.group]]
  id = "desk"
  title = "Workstations"

    [[page.group.card]]
    id = "desktop"
    name = "DESKTOP"
    tcp = "192.0.2.30:3389"   # Windows drops ping; check a port it listens on instead
    on_demand = true

[[page]]
id = "network"
title = "NETWORK"

  [[page.group]]
  id = "router"
  title = "Network"

    [[page.group.card]]
    id = "router"
    name = "ROUTER"
    ping = "192.0.2.1"
    large = true
    metrics = [
      { key = "opnsense.cpu", label = "CPU", format = "percent" },
      { key = "opnsense.wan_dn", label = "WAN ↓", format = "rate" },
      { key = "opnsense.wan_up", label = "WAN ↑", format = "rate" },
    ]

    [[page.group.card]]
    id = "switch"
    name = "SWITCH"
    ping = "192.0.2.2"

  [[page.group]]
  id = "lists"
  title = "Activity"

    [[page.group.card]]
    id = "recent"
    name = "RECENTLY ADDED"
    list = "recent.added"   # dotted path to a list in the collected data
    limit = 5                     # rows shown on the card (1-50)

    # What changed lately (hosts up/down, guests started/stopped, sources that stopped
    # answering, new alerts, config reloads), kept by labhud itself: nothing to set up.
    # The history lives in memory, so a restart starts a new one.
    [[page.group.card]]
    id = "events"
    name = "CHANGES"
    list = "events.recent"
    limit = 6

# Bottom strip: a row of status lights with a short code, each borrowing the state of a card.
# `ip` is optional and adds per-host traffic where the router reports it.
[[strip]]
code = "RTR"
name = "Router"
card = "router"

[[strip]]
code = "PVE"
name = "PVE"
card = "host-pve"
ip = "192.0.2.10"

[[strip]]
code = "NAS"
name = "NAS"
card = "nas"
ip = "192.0.2.20"

# Hosts that are off on purpose in a time window (hours, local time, may cross midnight):
# shown as scheduled instead of down, and not polled in their window. `sources` lists the
# data sources that depend on that host and should also pause.
[quiet_hours.nas]
from = 0
to = 8
sources = ["synology"]

# The alert banner (optional): a list of {id, text} from your live agent, and the page that
# gets a mark in the menu while one is open. See docs/live-agent.md.
# [alerts]
# path = "live.alerts"
# page = "network"

# Alert rules on hosts (optional; ⚙ > Alerts writes them). Without any, these defaults apply
# to every card with an agent of its own ("*"); `alert = []` (at the top) turns them off. `what`
# is cpu, mem, disk, temp (the hottest of CPU and GPUs), offline (the agent gone) or failed
# (systemd units in the failed state); `above` is % (°C for temp), not for offline and failed,
# `minutes` how long it must last. A card's own rule wins over "*".
# [[alert]]
# on = "*"
# what = "cpu"
# above = 90
# minutes = 10
#
# [[alert]]
# on = "host-pve"
# what = "disk"
# above = 80

# Where notifications go (optional): ntfy (LABHUD_NOTIFY_URL), the LabHUD app, or both (the
# default), and the quiet hours (23 to 7 by default; the same hour twice = none). In them only
# urgent news goes out (offline, disk, temperature, a host down); the rest waits for the end, in
# one message.
# Updates (optional): every six hours LabHUD reads the latest releases of itself, its agent and its
# app from GitHub, and ⚙ > System > About says "Update available". false: it never asks.
# [update]
# check = true

# The audit log (⚙ > System > API & audit) keeps this many days of entries, 7 to 730.
# [audit]
# keep_days = 90

# [notify]
# via = "both"
# quiet_from = 23
# quiet_to = 7
#
# More channels, each tried with a test from ⚙ > Notifications (which writes these for you). The
# secrets stay out of this file, in secrets.env: LABHUD_NOTIFY_SMTP_PASSWORD (email),
# LABHUD_NOTIFY_WEBHOOK_URL and LABHUD_NOTIFY_WEBHOOK_AUTH (a JSON POST), LABHUD_NOTIFY_DISCORD_URL
# (a Discord webhook), LABHUD_NOTIFY_GOTIFY_TOKEN (an app token).
# [notify.email]
# host = "smtp.example.org"
# security = "starttls"          # starttls (587), ssl (465) or none (25); port = ... to change it
# user = "labhud@example.org"
# from = "labhud@example.org"    # default: user
# to = ["me@example.org"]
# [notify.gotify]
# url = "https://gotify.example.org"
#
# Which news goes where: app, ntfy, email, webhook, discord, gotify. Without this table the bad
# news goes to every channel that is set, and update_available, update_done and admin_login
# nowhere. The events: alert, host_down, container_stopped, update_available, update_done,
# agent_offline, admin_login, backup_failed.
# [notify.events]
# host_down = ["app", "ntfy", "email"]
# update_available = ["discord"]
# admin_login = ["email"]

# Private registries (optional): labhud signs the agent in when it pulls or checks an image from
# one of them. The token or password is in secrets.env, as LABHUD_REGISTRY_<HOST>_TOKEN (the host
# in capitals, every other character _: LABHUD_REGISTRY_GHCR_IO_TOKEN). ⚙ > Containers adds them.
# [[registry]]
# host = "ghcr.io"
# user = "me"

# Action buttons (optional, and off unless LABHUD_ACTION_URL is set: see docs/actions.md): a label and a confirmation text per action name. Without an
# entry, the label comes from the name (wol-* START, shutdown-* SHUT DOWN,
# vm-<node>-<vmid>-start/shutdown/reboot) and the question is "<label> <card name>?".
[action.wol-backup]
label = "WAKE"
confirm = "Wake the backup server now?"

# An action can ask a question instead of yes/no: each choice is an action of its own, sent to
# the agent as such (only these can be sent). The card lists the first one in its `actions`.
#
#   [action.vm-node1-101-reboot]
#   confirm = "Reboot the VM when?"
#   choices = [{ label = "NOW", action = "vm-node1-101-reboot" },
#              { label = "TONIGHT", action = "vm-node1-101-reboot-tonight" }]

# Maintenance: a card that is down on purpose. Not red, no notification, it does not take the
# screen, and its history line says "(maintenance)". Times are labhud's local time (TZ).
#
#   [maintenance]
#   buttons = true          # a MAINTENANCE button in each card's panel: 1 hour, 4 hours, 1 day
#
#   [[maintenance.window]]
#   cards = ["vm-node1-101"]
#   from = "2026-10-12 08:00"    # optional: from now
#   until = "2026-10-12 12:00"
#   reason = "disk swap"

# A page can be a grid of game servers instead of fixed cards:
#
#   [[page]]
#   id = "games"
#   title = "GAMES"
#   games = "live.games.servers"   # dotted path to a list of servers in the collected data

# Sparklines: every number shown as a percentage, a temperature or a rate gets a faint line
# of its last 6 hours behind it. On unless this is false.
# sparklines = false

# Bars (optional): CPU, RAM and disk turn orange at `warn` and red at `crit` percent, on the
# wall, in the app and in the notifications alike. A metric's own warn/crit wins.
# [display]
# warn = 80
# crit = 92
# Icons: a card's, a guest's or a container's logo that labhud does not carry is fetched once from
# the dashboard-icons pack through jsDelivr and kept in LABHUD_DATA/icons. false: never ask.
# icons_online = true

# Night (optional): between these hours of the display's own clock the screen dims to `dim`
# percent (0 = black). A touch lights it up for a minute; a new problem lights it up while the
# page with that problem is shown.
# [night]
# from = 23
# to = 7
# dim = 25

# The weather in the top bar (Open-Meteo, no key). Leave this table out to hide it.
[weather]
latitude = 52.52
longitude = 13.41
timezone = "Europe/Berlin"   # optional, defaults to the location's own
city = "Berlin"              # optional, shown next to the temperature

# Optional: the search box (🔍 in the top bar, or "/") finds every card and bookmark; what matches
# nothing goes here, %s standing for the words.
# [search]
# url = "https://duckduckgo.com/?q=%s"

# Optional: plain links, by group, on a card with `bookmarks = true` (or `bookmarks = "Docs"` for
# one group) and in the search. A card with `notes = true` shows the text written in its panel.
# [[bookmark]]
# group = "Docs"
# name = "Proxmox wiki"
# url = "https://pve.proxmox.com/wiki/Main_Page"

# Optional: when nothing is red for `after` seconds (300), the screen shows only a big clock and
# "ALL GOOD"; a problem or a touch brings the cards back. The clock jumps to another spot every
# 5 minutes so an OLED does not burn in.
# [calm]
# after = 300

# Optional: the lock. Set a 4-digit PIN in ⚙ > Lock on the display (or `init.py pin`), and the
# screen is only for looking until someone types it. Open, it locks again after `idle` minutes
# without a touch (default 10, from 1 to 120); the lock left of ⚙ closes it at once.
# [lock]
# idle = 10

# Optional: the admin's sessions and networks, and single sign-on (all also in ⚙ > Security).
# session_hours: how long a browser stays signed in without use (1 to 720, default 720 = 30 days).
# trusted_proxies: the reverse proxies whose X-Forwarded-For is believed (none: it is ignored).
# admin_networks: the only networks the admin may sign in and act from (none: anywhere).
# [admin]
# session_hours = 168
# trusted_proxies = ["172.18.0.0/16"]
# admin_networks = ["192.168.1.0/24", "10.6.0.0/24"]
#
# Single sign-on with Authentik (or any OpenID Connect provider): an OAuth2/OpenID provider there,
# confidential, signing key RS256, redirect URI https://<labhud>/api/admin/oidc/callback. Whoever
# is in `allow` (user name or verified email) or in a group of `allow_groups` signs in as the admin;
# the password and authenticator still work. The client secret goes in secrets.env (⚙ > Security):
# LABHUD_OIDC_CLIENT_SECRET=...
# [admin.oidc]
# issuer = "https://auth.example.org/application/o/labhud/"
# client_id = "..."
# allow_groups = ["labhud admins"]
# redirect_uri = "https://hud.example.org/api/admin/oidc/callback"   # optional: else the address used

# Optional: a public status page on its own port (LABHUD_PUBLIC_PORT), with only the names and
# states (up, down, maintenance) of these groups' cards: no address, number or button. Expose
# that port alone, e.g. for the people who play on your game servers.
# [public]
# title = "Lab status"
# groups = ["pve"]
