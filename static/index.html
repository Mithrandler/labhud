<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>LabHUD</title>
<link rel="stylesheet" href="/app.css">
<!-- Installable: "Add to Home screen" opens it full screen (a browser installs a web app only over
     HTTPS; over plain HTTP the same entry is a shortcut that opens in a tab). -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
  <!-- The top bar: weather on the left, the pages in the middle, the clock on the right.
       There is no submenu: all groups of a page sit on the same screen.
       The brand shows only in portrait, where the middle of the first row is free. -->
  <header id="topbar">
    <div id="weather" class="empty"><span class="ic"></span><span class="t"></span><span class="city"></span></div>
    <div id="brand" aria-hidden="true">Lab<b>HUD</b></div>
    <nav id="menu" aria-label="Pages"></nav>
    <div id="clock"><button id="health" type="button" hidden></button><button id="gear" type="button" title="Settings of this screen" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M18.86 10.61 L21.12 10.81 L21.12 13.19 L18.86 13.39 L17.83 15.87 L19.29 17.61 L17.61 19.29 L15.87 17.83 L13.39 18.86 L13.19 21.12 L10.81 21.12 L10.61 18.86 L8.13 17.83 L6.39 19.29 L4.71 17.61 L6.17 15.87 L5.14 13.39 L2.88 13.19 L2.88 10.81 L5.14 10.61 L6.17 8.13 L4.71 6.39 L6.39 4.71 L8.13 6.17 L10.61 5.14 L10.81 2.88 L13.19 2.88 L13.39 5.14 L15.87 6.17 L17.61 4.71 L19.29 6.39 L17.83 8.13 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button><button id="lock-btn" type="button" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path class="shackle" d="M8 11 V7.5 a4 4 0 0 1 8 0 V11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="16" r="1.3" fill="currentColor"/></svg></button><span class="time"></span><span class="date"></span></div>
  </header>

  <!-- Actions being followed (send_action): under the top bar, on every page, until they end. -->
  <div id="actions-bar" hidden></div>

  <!-- The alert banner: sits over the content, does not push the grid. -->
  <div id="alerts" hidden></div>

  <main id="content"></main>

  <div id="strip"></div>

  <!-- config.toml was edited and has problems: the screen keeps the last good version. -->
  <div id="config-errors" hidden></div>

  <!-- The detail panel. Opens on a short tap on any card; the actions
       (WoL, start/stop) are at the bottom, as big buttons. -->
  <div id="panel" hidden>
    <div id="panel-bar"><span id="panel-title"></span><button id="panel-x" type="button">✕</button></div>
    <div id="panel-body"></div>
    <div id="panel-actions"></div>
  </div>

  <!-- ⚙: this screen's own settings (theme, text, rotation, night), see settings.js. -->
  <div id="settings" hidden>
    <div id="settings-bar"><span>SETTINGS · THIS SCREEN</span><button id="settings-x" type="button">✕</button></div>
    <div id="settings-body"></div>
  </div>

  <div id="confirm" hidden>
    <div class="box"><p id="confirm-text"></p><div class="buttons"></div></div>
  </div>

  <!-- The first time a screen opens labhud: four short notes, then never again on that screen. -->
  <div id="tour" hidden><div class="box"><p class="text"></p><div class="buttons">
    <button type="button" class="skip">Skip</button><button type="button" class="next">Next</button></div>
    <div class="steps"></div></div></div>

  <!-- [calm]: nothing is red, so only the time and one word. A touch or a problem ends it. -->
  <div id="calm" hidden><div class="box"><div class="time"></div><div class="date"></div>
    <div class="state">ALL GOOD</div><div class="facts"></div><div class="extras"></div></div></div>

  <!-- [night]: a black sheet over everything, see render_night. Touches go through it. -->
  <div id="night-shade"></div>

  <div id="stream-state" title="link to the aggregator"></div>
<script src="/settings.js"></script>
<script src="/lock.js"></script>
<script src="/app.js"></script>
</body>
</html>
